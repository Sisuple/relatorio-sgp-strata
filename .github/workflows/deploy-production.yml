name: Deploy Produção

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "pytest>=8,<10"

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build Docker image (smoke test)
        run: docker build -t relatorio-sgp-strata:ci .

  build-and-push:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/strataengenharia/relatorio-sgp-strata:${{ github.sha }}
            ghcr.io/strataengenharia/relatorio-sgp-strata:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        sistema:
          - name: "Dashboard DNIT-RO"
            ip: "187.77.237.150"
            pasta: "relatorio-sgp-strata"
            key_secret: "PROD_SSH_KEY"
          
          - name: "Dashboard CNL"
            ip: "187.77.237.146"
            pasta: "relatorio-sgp-strata"
            key_secret: "PROD_SSH_KEY_CNL"
            
    steps:
      - name: Deploy via SSH em ${{ matrix.sistema.name }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ matrix.sistema.ip }}
          username: suple
          key: ${{ secrets[matrix.sistema.key_secret] }}
          port: 22
          script: |
            set -e
            cd /var/www/${{ matrix.sistema.pasta }}
            ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            git fetch origin
            git reset --hard origin/main
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            docker compose -f docker-compose.yaml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yaml -f docker-compose.prod.yml up -d
            for i in $(seq 1 10); do
              if curl -fsS http://127.0.0.1:8501/_stcore/health; then
                echo "Aplicação saudável."
                exit 0
              fi
              echo "Tentativa $i falhou, aguardando..."
              sleep 3
            done
            echo "Healthcheck falhou após 10 tentativas."
            exit 1
