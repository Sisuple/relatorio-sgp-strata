services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: relatorio-sgp-strata:latest
    container_name: relatorio-sgp-strata
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  auth-gateway:
    build:
      context: ./auth-gateway
      dockerfile: Dockerfile
    image: relatorio-sgp-strata-auth-gateway:latest
    container_name: relatorio-sgp-strata-auth-gateway
    ports:
      - "127.0.0.1:8502:8502"
    env_file:
      - .env
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
